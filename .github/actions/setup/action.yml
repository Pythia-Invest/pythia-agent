name: Set up the Pythia toolchain
description: Pinned Node, just and pnpm dependencies, plus the pinned Python when tests need it.

inputs:
  python:
    description: Install the pinned Python and put it first on PATH.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: 1.46.0
    - shell: bash
      run: corepack enable
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: 0.9.28
    - if: inputs.python == 'true'
      shell: bash
      run: |
        uv python install "$(cat .python-version)"
        dirname "$(uv python find "$(cat .python-version)")" >> "$GITHUB_PATH"
    - shell: bash
      run: just bootstrap
