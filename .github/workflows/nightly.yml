name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]

# Each main commit and each night keeps its own verdict.
concurrency:
  group: nightly-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualification:
    name: Broad qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - id: build
        run: pnpm run build
      - run: just qualify-tests
      # Runs even when a qualification test fails, so one red file cannot
      # hide the assembled run.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just qualify-assembled

  audit:
    name: Full dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just audit-all
