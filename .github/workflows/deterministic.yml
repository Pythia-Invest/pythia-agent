name: Deterministic checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS deterministic checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: 1.46.0
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.9.28
          enable-cache: true
      - run: uv python install 3.12.11
      - run: just bootstrap
      - run: just check
      - run: just test
      - run: just audit

  ubuntu:
    name: Ubuntu deterministic checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: 1.46.0
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.9.28
          enable-cache: true
      - run: uv python install 3.12.11
      - run: just bootstrap
      - run: just check
      - run: just test
      - run: just audit
