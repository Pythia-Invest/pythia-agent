skills:
  external_dirs:
    - "${PYTHIA_MANAGED_SKILLS_DIR}"
  disabled: []
  # Hermes writes its own skills from past turns every N tool iterations; off until it is mature enough. The
  # investor turns it back on with `hermes config set skills.creation_nudge_interval 10`.
  creation_nudge_interval: 0
plugins:
  enabled:
    - pythia
platform_toolsets:
  cli:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  cron:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  api_server:
    - pythia-desk
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# Plugin operations live in core's hidden pythia-core toolset: runnable by Pythia, never offered to the model. The
# agent's Pythia tools (pythia-desk) and the plugins' provider tools (a toolset per plugin) serve Desk chat
# (api_server); cli and cron sessions have no trusted caller for them yet (docs/architecture/agent-tools.md).
known_plugin_toolsets:
  cli:
    - pythia-core
    - pythia-desk
    - pythia-sec
    - pythia-xbrl-filings
    - pythia-gleif
    - pythia-eodhd
    - pythia-yahoo-discovery
    - pythia-coinmarketcap
    - pythia-openfigi
    - pythia-hyperliquid
  cron:
    - pythia-core
    - pythia-desk
    - pythia-sec
    - pythia-xbrl-filings
    - pythia-gleif
    - pythia-eodhd
    - pythia-yahoo-discovery
    - pythia-coinmarketcap
    - pythia-openfigi
    - pythia-hyperliquid
  api_server:
    - pythia-core
auxiliary:
  free_only: true
