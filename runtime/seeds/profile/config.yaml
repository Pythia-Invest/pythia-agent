skills:
  external_dirs:
    - "${PYTHIA_MANAGED_SKILLS_DIR}"
  disabled: []
  # Agent-initiated skill writing is off for now (docs/architecture/agent-tools.md): no background skill review,
  # every skill_manage write is staged for the investor's approval (`/skills pending`), and the curator (below)
  # does not rewrite skills. Turn it back on with `hermes config set skills.creation_nudge_interval 10`,
  # `hermes config set skills.write_approval false` and `hermes config set curator.enabled true`.
  creation_nudge_interval: 0
  write_approval: true
curator:
  enabled: false
plugins:
  enabled:
    - pythia
platform_toolsets:
  cli:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  cron:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  api_server:
    - pythia-desk
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# Plugin operations live in core's hidden pythia-core toolset: runnable by Pythia, never offered to the model. The
# agent's Pythia tools (pythia-desk) and the plugins' provider tools (a toolset per plugin) serve Desk chat
# (api_server); cli and cron sessions have no trusted caller for them yet (docs/architecture/agent-tools.md).
known_plugin_toolsets:
  cli:
    - pythia-core
    - pythia-desk
    - pythia-sec
    - pythia-xbrl-filings
    - pythia-gleif
    - pythia-eodhd
    - pythia-yahoo-discovery
    - pythia-coinmarketcap
    - pythia-openfigi
    - pythia-hyperliquid
  cron:
    - pythia-core
    - pythia-desk
    - pythia-sec
    - pythia-xbrl-filings
    - pythia-gleif
    - pythia-eodhd
    - pythia-yahoo-discovery
    - pythia-coinmarketcap
    - pythia-openfigi
    - pythia-hyperliquid
  api_server:
    - pythia-core
auxiliary:
  free_only: true
platform_hints:
  api_server:
    replace: >-
      You are responding in Pythia Desk, which supports Markdown formatting.
      File/media delivery: images referenced as MEDIA:/absolute/path tags
      (.png/.jpg/.jpeg/.gif/.webp/.bmp, up to 5MB) are inlined as base64 data
      URLs in responses on the chat, completions, and responses endpoints.
      Non-image files are NOT intercepted anywhere, and the runs endpoint
      intercepts nothing — a MEDIA: tag there renders as literal text exposing
      a raw host filesystem path. For those cases, state the plain file path
      in your response text instead of a MEDIA: tag.
