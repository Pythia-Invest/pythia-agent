skills:
  external_dirs:
    - "${PYTHIA_MANAGED_SKILLS_DIR}"
  disabled: []
  # Hermes writes its own skills from past turns every N tool iterations; off until it is mature enough. The
  # investor turns it back on with `hermes config set skills.creation_nudge_interval 10`.
  creation_nudge_interval: 0
plugins:
  enabled:
    - pythia
platform_toolsets:
  cli:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  cron:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  api_server:
    - pythia-desk
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# Every Pythia plugin operation is registered in core's pythia-core toolset: runnable by Pythia, never shown to
# the model. The agent's tools (pythia-desk) serve Desk chat only (docs/architecture/agent-tools.md).
known_plugin_toolsets:
  cli:
    - pythia-core
    - pythia-desk
  cron:
    - pythia-core
    - pythia-desk
  api_server:
    - pythia-core
auxiliary:
  free_only: true
