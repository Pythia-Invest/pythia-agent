skills:
  external_dirs:
    - "${PYTHIA_MANAGED_SKILLS_DIR}"
  disabled: []
plugins:
  enabled:
    - pythia
platform_toolsets:
  cli:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  cron:
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  api_server:
    - pythia-desk
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# Every Pythia plugin operation is registered in core's pythia-core toolset: runnable by Pythia, never shown to
# the model. The agent's tools (pythia-desk) serve Desk chat only (docs/architecture/agent-tools.md).
known_plugin_toolsets:
  cli:
    - pythia-core
    - pythia-desk
  cron:
    - pythia-core
    - pythia-desk
  api_server:
    - pythia-core
tools:
  tool_search:
    enabled: "off"
auxiliary:
  free_only: true
